version: '3.8'

services:
  web:
    build: .
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    volumes:
      - .:/app
    restart: unless-stopped

  # Postgres opcional para features avanzadas (logs, usuarios, facturación)
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: example
      POSTGRES_DB: multi_whatsapp
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:

